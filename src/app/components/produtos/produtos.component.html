<h2>🍰 Cardápio</h2>
<div class="card" *ngFor="let p of produtos">
  <img [src]="imagemProduto(p)" (error)="usarImagemLocal($event, p)" alt="{{ p.name }}">
  <h3>{{ p.name }}</h3>
  <p>{{ p.description }}</p>
  <p><strong>R$ {{ p.price }}</strong></p>
  <button (click)="adicionar(p)">Adicionar</button>

  <!-- Upload de imagem -->
  <input type="file" (change)="onFileSelected($event, p)">
</div>
