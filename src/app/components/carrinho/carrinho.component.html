<!-- Dados do cliente -->
<div class="cliente-form">

  <h2 class="titulo-carrinho">Seu carrinho</h2>

  <div class="form-group">
    <label>Seu nome</label>
    <input [(ngModel)]="nomeCliente" placeholder="Seu nome" />
  </div>

  <div class="form-group">
    <label>Seu telefone</label>
    <input [(ngModel)]="telefoneCliente" placeholder="Seu telefone" />
  </div>

  <div class="form-group">
    <label>Seu endereço</label>
    <input [(ngModel)]="enderecoCliente" placeholder="Seu endereço" />
  </div>

  <div class="form-group">
    <label>Comentário do pedido</label>
    <textarea
      [(ngModel)]="comentarioCliente"
      placeholder="Ex: sem açúcar, entregar após 18h..."
      rows="4">
    </textarea>
  </div>
</div>

<hr>

<!-- Lista de produtos no carrinho -->
<div *ngFor="let p of carrinho; let i = index" class="item">

  <!-- Imagem do produto -->
  <img
    class="foto-produto"
    [src]="imagemProduto(p)"
    (error)="usarImagemLocal($event, p)"
    alt="{{ p.name }}"
  />

  <div class="info">
    <p class="nome-produto">{{ p.name }}</p>
    <p class="preco-produto">R$ {{ p.price }}</p>
  </div>

  <button class="btn-remover" (click)="remover(i)">Remover</button>
</div>

<hr>

<!-- Total -->
<p class="total">Total: R$ {{ total }}</p>

<!-- Botão finalizar -->
<button class="finalizar" (click)="enviarWhatsApp()">
  Finalizar pedido
</button>
