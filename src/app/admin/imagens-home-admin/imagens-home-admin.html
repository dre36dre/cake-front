<h2>Editar Imagens da Home</h2>

<p *ngIf="erro">{{ erro }}</p>

<div *ngIf="carregando">Carregando...</div>

<div *ngIf="!carregando">
  <button type="button" (click)="adicionarImagem()">Adicionar Imagem</button>
  <button type="button" (click)="salvar()" [disabled]="salvando">{{ salvando ? 'Salvando...' : 'Salvar' }}</button>

  <div *ngFor="let imagem of imagens; let i = index" class="imagem-item">
    <img [src]="getImagemSrc(imagem.arquivo)" [alt]="imagem.titulo" style="width: 100px; height: 100px; object-fit: cover;">
    <input type="text" [(ngModel)]="imagem.titulo" placeholder="Título">
    <input type="file" (change)="onFileSelected($event, i)" accept="image/*">
    <button type="button" (click)="removerImagem(i)">Remover</button>
  </div>
</div>
