

<!-- 👇 dados do cliente -->
<input [(ngModel)]="nomeCliente" placeholder="Seu nome" />
<input [(ngModel)]="telefoneCliente" placeholder="Seu telefone" />
<input [(ngModel)]="enderecoCliente" placeholder="Seu endereço" />
<hr>

<!-- produtos -->
<div *ngFor="let p of carrinho; let i = index">
  <p>{{ p.name }} - R$ {{ p.price }}</p>
  <button (click)="remover(i)">Remover</button>
</div>

<hr>

<p>Total: R$ {{ total }}</p>

<button (click)="enviarWhatsApp()">
  Finalizar pedido
</button>
