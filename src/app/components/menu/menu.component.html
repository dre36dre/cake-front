<h2>🍰 Cardápio</h2>

<div *ngFor="let p of produtos" style="border:1px solid #ccc; padding:10px; margin:10px">

  <img
    [src]="'http://localhost:8080/produtos/imagens/' + p.imageUrl"
    (error)="usarImagemLocal($event, p.imageUrl)"
    [alt]="p.name"
    width="150"
  />

  <h3>{{ p.name }}</h3>

  <p>{{ p.description }}</p>

  <p><strong>R$ {{ p.price }}</strong></p>

  <button (click)="adicionar(p)">Adicionar</button>

</div>
