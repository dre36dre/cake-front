<section class="home-hero">
  <div>
    <h2>Bem-vindo a Confeitaria da Dona</h2>
    <p>Escolha nossos produtos no Cardapio</p>
  </div>

  <img src="assets/imagenshome/home.JPG" alt="Confeitaria da Dona">
</section>

<section class="galeria-home">
  <article class="foto-home" *ngFor="let imagem of imagensHome">
    <img [src]="'assets/imagenshome/' + imagem.arquivo" [alt]="imagem.titulo">
    <h3>{{ imagem.titulo }}</h3>
  </article>
</section>

<app-produtos></app-produtos>
