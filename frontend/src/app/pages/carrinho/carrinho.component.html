<div class="carrinho-page">

  <div class="card-carrinho">

    <h2 class="titulo-carrinho">Seu Carrinho</h2>

    <!-- Dados do cliente -->
    <div class="cliente-form">

      <div class="form-group">
        <input [(ngModel)]="nomeCliente"
               placeholder="Seu nome" />
      </div>

      <div class="form-group">
        <input [(ngModel)]="telefoneCliente"
               placeholder="Seu telefone" />
      </div>

      <div class="form-group">
        <input [(ngModel)]="enderecoCliente"
               placeholder="Seu endereço" />
      </div>

      <div class="form-group">
        <label class="comentario-label">
          Observação do pedido
        </label>

        <textarea
          [(ngModel)]="comentarioCliente"
          placeholder="Ex: sem açúcar, entregar após 18h..."
          rows="4">
        </textarea>
      </div>

    </div>

    <hr>

    <!-- Produtos -->
    <div *ngFor="let p of carrinho; let i = index"
         class="item">

      <img
        class="foto-produto"
        [src]="imagemProduto(p)"
        (error)="usarImagemLocal($event,p)"
        alt="{{p.name}}">

      <div class="info">
        <p class="nome-produto">{{p.name}}</p>
        <p class="preco-produto">
          R$ {{p.price}}
        </p>
      </div>

      <button
      class="btn-remover"
      (click)="remover(i)">
      Remover
      </button>

    </div>

    <hr>

    <p class="total">
      Total:
      <span>R$ {{total}}</span>
    </p>

    <button
      class="finalizar"
      (click)="abrirConfirmacaoPedido()">

      Finalizar Pedido

    </button>

  </div>

  <div class="confirmacao-overlay" *ngIf="mostrandoConfirmacao">
    <div class="confirmacao-modal" role="dialog" aria-modal="true" aria-labelledby="confirmacao-titulo">
      <h3 id="confirmacao-titulo">Confirmar pedido?</h3>
      <p>Seu pedido será enviado para a confeitaria e o WhatsApp será aberto para continuar o atendimento.</p>

      <div class="confirmacao-resumo">
        <strong>Total: R$ {{ total }}</strong>
        <span>{{ carrinho.length }} item(ns)</span>
      </div>

      <div class="confirmacao-acoes">
        <button type="button" class="btn-voltar" (click)="cancelarConfirmacao()">Voltar</button>
        <button type="button" class="btn-confirmar" (click)="confirmarPedido()">Confirmar pedido</button>
      </div>
    </div>
  </div>

</div>
